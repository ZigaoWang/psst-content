[project]
name = "psst"
version = "1.0.0"
description = "The Psst content pipeline: research, review, and publishing"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "h3>=4.1",
    "jsonschema>=4.23",
    "pypinyin>=0.55.0",
    "pypdf>=6.19.0",
    "pillow>=11",
]

[project.scripts]
psst = "psst.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
