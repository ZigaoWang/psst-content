name: Validate content

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formatting
        run: python3 scripts/format.py --check
      - name: Rules and style
        run: python3 scripts/validate.py
