# Psst: content downloads, the privacy policy, and two small API endpoints.
# Installed as /etc/nginx/conf.d/psst.conf by server/setup.sh. Separate from every other site on this host.

# Rate limits are kept per IP address in memory only, and forgotten; nothing about a visitor is written down.
limit_req_zone $binary_remote_addr zone=psst_reports:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=psst_demand:10m rate=20r/m;

# Logs never contain IP addresses (see the privacy policy). The error log is kept to critical problems,
# because nginx adds the client's address to ordinary request errors.
log_format psst_noip '$time_iso8601 "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name psst.zigao.wang psst.67-230-170-225.sslip.io;

    access_log /var/log/nginx/psst.access.log psst_noip;
    error_log  /var/log/nginx/psst.error.log crit;

    location /.well-known/acme-challenge/ { root /www/wwwroot/psst/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psst.zigao.wang psst.67-230-170-225.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/psst/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psst/privkey.pem;

    root /www/wwwroot/psst/public;
    access_log /var/log/nginx/psst.access.log psst_noip;
    error_log  /var/log/nginx/psst.error.log crit;
    add_header X-Content-Type-Options nosniff always;

    # Manifests change on every publish, so never cache them.
    location ~ ^/content/(staging|production)/v[0-9]+/manifest\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        default_type application/json;
    }

    # Packs are named by their hash and never change.
    location ~ ^/content/(staging|production)/v[0-9]+/packs/ {
        gzip off;
        types { }
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /content/ { return 404; }

    location = /privacy { return 301 /privacy/; }
    location /privacy/ { index index.html; }

    # The coverage map is for the team only.
    location /coverage/ {
        auth_basic "Psst coverage";
        auth_basic_user_file /www/wwwroot/psst/coverage.htpasswd;
        index index.html;
    }

    # The API never sees the visitor's address: nothing identifying is forwarded.
    location = /api/v1/reports {
        limit_req zone=psst_reports burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /api/v1/demand {
        limit_req zone=psst_demand burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787;
    }
    location /api/ {
        limit_req zone=psst_reports burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787;
    }

    location = / { return 302 /privacy/; }
    location / { return 404; }
}
